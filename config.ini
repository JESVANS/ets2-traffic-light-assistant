# ============================================================
#  ETS2 红绿灯巡航辅助 配置文件
#  修改后重启程序生效
# ============================================================

[General]
# 数据刷新频率（次/秒），10 已足够流畅，越低越省资源
poll_hz = 10

[Source]
# scs-telemetry.dll 提供的遥测共享内存（车速 / 坐标 / 朝向）
scs_shm_name = Local\SCSTelemetry
# ets2la_plugin.dll 提供的红绿灯共享内存
semaphore_shm_name = Local\ETS2LASemaphore
# 红绿灯坐标所用扇区大小：世界坐标 = 局部坐标 + 扇区号 * sector_size
sector_size = 512
# 读取的红绿灯条目上限，0 = 按共享内存大小自动计算
max_entries = 0
# 游戏时间停止更新超过多少秒视为游戏已退出
stale_timeout = 3.0

[StateCodes]
# ets2la_plugin 中红绿灯状态值对应关系（一般无需修改，可用 probe.py 校验）
off = 0
yellow = 1
red = 2
red_yellow = 4
green = 8
flashing = 32
# 道闸（收费站 / 铁路道口）状态值
gate_closing = 0
gate_closed = 1
gate_opening = 2
gate_open = 3

[Selection]
# 搜索前方红绿灯的最远距离（米）
max_distance = 400
# 允许的横向偏移（米），弯道处会按距离自动放宽
max_lateral = 12
lateral_growth = 0.12
# 允许的高度差（米），用于排除立交桥上 / 下方的信号灯
max_height_diff = 12
# 信号灯朝向与车头方向平行度阈值（0~1），用于排除横向路口的信号灯
parallel_threshold = 0.6
# 朝向过滤模式：0 = 同向/反向都接受，1 = 只接受同向，-1 = 只接受反向
facing_mode = 0
# 信号灯灯杆到停车线的预估距离（米）
stop_line_offset = 4
# 横向偏移在评分中的权重（越大越偏好正前方车道的灯）
lateral_weight = 3.0
# 是否同时提示道闸
include_gates = true

[Advisor]
# 舒适减速度（m/s²），超出则提示尽早减速
comfort_decel = 1.0
# 最大可接受减速度（m/s²），超出则提示紧急制动
max_decel = 1.8
# 卡车可用加速度（m/s²）
max_accel = 0.6
# 绿波建议的最低车速（km/h），低于此速度改为提示停车
min_glide_speed_kmh = 20
# 无限速数据时的默认最高车速（km/h）
default_max_speed_kmh = 90
# 红灯后的红黄灯时长预估（秒），用于计算绿灯到来时间
red_yellow_duration = 2.0
# 是否以道路限速作为建议车速上限
use_speed_limit = true

[Overlay]
# 悬浮窗位置（可在托盘菜单「解锁位置」后拖动，锁定时自动保存）
overlay_x = 209
overlay_y = 867
# 缩放比例
scale = 1.0
# 背景不透明度（0~1）
opacity = 0.80
# 前方无红绿灯时隐藏悬浮窗主体，只保留小状态条
hide_when_no_light = true
# 需要减速 / 紧急制动时蜂鸣提醒
sound_alert = true
