; ============================================================
;  ETS2 车窗红绿灯 HUD 插件配置文件 (ets2_tl_hud.ini)
;  放置于 Euro Truck Simulator 2\bin\win_x64\plugins\ 目录
;  游戏内按 Ctrl + F10 可随时热重载，无需重启游戏
; ============================================================

[HUD]
; 显示模式：
;   window_3d = 3D 车窗投影（默认，固定在驾驶室前挡风玻璃上，转头随车窗透视移动，车外自动隐藏）
;   screen_2d = 游戏内 2D 固定位置 HUD（始终固定在游戏画面绿框处）
mode = window_3d

; 3D 车窗模式相对驾驶员正视眼睛基准点的位置偏移（单位：米）
;   offset_x：正数向右，负数向左（默认 +0.160 避开左侧导航 HUD，位于绿框处）
;   offset_y：正数向上，负数向下（默认 -0.245 位于方向盘正上方、挡风玻璃下沿）
;   offset_z：负数向前（默认 -1.390 贴合前挡风玻璃）
; 游戏内也可按 Ctrl + 方向键 / PageUp / PageDown 实时微调并自动保存！
offset_x = 0.160
offset_y = -0.245
offset_z = -1.390

; 3D 车窗 HUD 面板尺寸（米）与向驾驶员仰角（度）
panel_width = 0.420
panel_height = 0.155
tilt_deg = 8.0

; 2D 模式（或未检测到相机数据时自动退化）的屏幕归一化位置 [0.0 ~ 1.0]
screen_x = 0.560
screen_y = 0.535
screen_width = 0.210

; 玻璃投影底衬不透明度（0.0 = 无底框纯投影，0.28 = 通透微暗滤光玻璃）
bg_opacity = 0.28
; 整体 HUD 不透明度（0.0 ~ 1.0）
hud_alpha = 0.94

; 切到车外视角时自动隐藏车窗 HUD
hide_outside_cab = true
; 红/黄灯需要停车或紧急制动时蜂鸣提醒
sound_alert = true
; 启动时默认开启演示预览（方便首次调整位置，调完后改回 false，也可在游戏里按 Ctrl+F9 切换）
start_demo = false

[Source]
sector_size = 512.0
stale_timeout = 3.0

[Selection]
max_distance = 300.0
max_lateral = 12.0
lateral_growth = 0.12
max_height_diff = 12.0
parallel_threshold = 0.6
facing_mode = 0
stop_line_offset = 4.0
lateral_weight = 3.0
include_gates = true

[Advisor]
comfort_decel = 2.0
max_decel = 4.5
max_accel = 0.6
min_glide_speed_kmh = 20.0
default_max_speed_kmh = 90.0
red_yellow_duration = 2.0
use_speed_limit = true

[StateCodes]
off = 0
yellow = 1
red = 2
red_yellow = 4
green = 8
flashing = 32
gate_closing = 0
gate_closed = 1
gate_opening = 2
gate_open = 3
